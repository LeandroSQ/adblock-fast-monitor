name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:host
      - name: Validate P0 performance baseline state
        run: npm run test:performance

  package-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install SDK extraction dependency
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Download and verify the pinned OpenWrt SDK
        run: |
          set -euo pipefail
          url=https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          sha256=1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc
          curl --fail --location --retry 3 --output sdk.tar.zst "$url"
          printf '%s  %s\n' "$sha256" sdk.tar.zst | sha256sum --check
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          rm sdk.tar.zst
      - name: Build target-neutral APK with the pinned SDK
        run: |
          set -euo pipefail
          sdk=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' -print -quit)
          test -n "$sdk"
          mkdir -p "$sdk/package/luci-app-adblock-fast-monitor"
          tar --exclude-vcs --exclude=node_modules --exclude=dist --exclude='openwrt-sdk-*' -cf - . |
            tar -C "$sdk/package/luci-app-adblock-fast-monitor" -xf -
          (cd "$sdk" && ./scripts/feeds update -a && ./scripts/feeds install -a)
          make -C "$sdk" defconfig
          make -C "$sdk" package/luci-app-adblock-fast-monitor/compile V=s
      - name: Preserve APK for real-system verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luci-app-adblock-fast-monitor-apk
          path: openwrt-sdk-*/bin/packages/**/luci-app-adblock-fast-monitor-*.apk
          if-no-files-found: error

  qemu-runtime:
    needs: package-sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 libguestfs-tools dnsutils
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: luci-app-adblock-fast-monitor-apk
          path: .ci-work/apk
      - name: Run package and real LuCI browser verification in QEMU
        run: |
          set -euo pipefail
          export PACKAGE_IPK="$(find "$PWD/.ci-work/apk" -type f -name '*.apk' -print -quit)"
          test -n "$PACKAGE_IPK"
          npm run test:qemu
