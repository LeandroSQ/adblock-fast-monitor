name: Release

# Tag vX.Y.Z-rN (must equal PKG_VERSION-rPKG_RELEASE in the Makefile).
# build and test run without secrets; only `sign` (environment `release`,
# required reviewer, tag rule v*) sees APK_SIGNING_KEY. See keys/README.md.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PKG: luci-app-adblock-fast-monitor
  PAGES_URL: https://leandrosq.github.io/adblock-fast-monitor

jobs:
  build:
    name: Build (unsigned) and signing self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must equal the Makefile version
        id: version
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^PKG_VERSION:=//p' Makefile)-r$(sed -n 's/^PKG_RELEASE:=//p' Makefile)"
          if [[ "$GITHUB_REF_NAME" != "v$ver" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Makefile version v$ver"
            exit 1
          fi
          echo "version=$ver" >>"$GITHUB_OUTPUT"
      - &sdk-cache
        name: Restore SDK tarball cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local-validation/openwrt-sdk-25.12.6-1864152619092e78.tar.zst
          key: openwrt-sdk-25.12.6-x86-64-1864152619092e78
      - name: Build the APK with the pinned SDK
        run: |
          set -euo pipefail
          apk="$(scripts/build-package.sh)"
          mkdir -p .ci-work/apk
          cp "$apk" "$(dirname "$apk")/package.sha256" "$(dirname "$apk")/source.sha256" .ci-work/apk/
      - name: Signing pipeline self-test (throwaway keys, deleted afterwards)
        run: scripts/release/selftest.sh "$RUNNER_TEMP/release-selftest" .ci-work/apk/package.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: .ci-work/apk/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Guest, browser and LuCI install tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GUEST_RUN_DIR: ${{ github.workspace }}/.ci-work/guest-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils dnsutils
      - name: Restore stock image, baseline and package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local-validation/qemu/openwrt.img.gz
            .local-validation/qemu/abfm-baseline-25.12.6.qcow2
            .local-validation/qemu/abfm-baseline-25.12.6.qcow2.manifest
            .local-validation/openwrt-package-mirror
          key: guest-25.12.6-${{ hashFiles('scripts/guest/prepare-baseline.sh', 'scripts/guest/lib.sh') }}
      - *sdk-cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: .ci-work/apk
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Guest tests and Playwright against the installed APK
        run: scripts/guest/run-guest-tests.sh --host-cmd scripts/guest/browser-tests.sh .ci-work/apk/package.apk
      - name: LuCI install from a throwaway-key feed (T22)
        run: scripts/guest/run-guest-tests.sh --no-install .ci-work/apk/package.apk test/guest/package-luci-install.host.sh
        env:
          ABFM_INSTALL_TEST: "1"
          GUEST_RUN_DIR: ${{ github.workspace }}/.ci-work/guest-run-install
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-logs
          path: |
            playwright-report/
            test-results/
            .ci-work/guest-run*/results/
            .ci-work/guest-run*/serial.log
          if-no-files-found: ignore
          retention-days: 7

  sign:
    name: Sign, verify, attest and publish the release
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A committed public key is required
        run: |
          if [[ ! -s keys/adblock-fast-monitor.pem ]]; then
            echo "::error::keys/adblock-fast-monitor.pem is missing; see keys/README.md"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: .ci-work/apk
      - name: The artifact is the one the build job produced
        working-directory: .ci-work/apk
        run: sha256sum --check package.sha256
      - *sdk-cache
      - name: Host apk 3.0.5 from the sha256-pinned SDK
        run: echo "APK_TOOL=$(scripts/release/apk-tool.sh)" >>"$GITHUB_ENV"
      - name: Previous signed packages (last 2 releases) stay in the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ci-work/previous
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 10 \
              --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -n 2 |
            while read -r tag; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir .ci-work/previous --pattern "$PKG-*.apk"
            done
          ls -l .ci-work/previous
      - name: Sign packages and index; mandatory apk verify against keys/
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APK_SIGNING_KEY" ]]; then
            echo "::error::secret APK_SIGNING_KEY is not set in environment release"
            exit 1
          fi
          key="$RUNNER_TEMP/apk-signing-key.pem"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$APK_SIGNING_KEY" >"$key")
          scripts/release/sign-feed.sh --key "$key" --keys-dir keys --base-url "$PAGES_URL" \
            --previous .ci-work/previous --out site .ci-work/apk/package.apk
      - name: Remove the key file in any case
        if: always()
        run: shred -u "$RUNNER_TEMP/apk-signing-key.pem" 2>/dev/null || rm -f "$RUNNER_TEMP/apk-signing-key.pem"
      - name: Re-verify the published files with the committed key only
        run: |
          set -euo pipefail
          "$APK_TOOL" verify --keys-dir "$PWD/keys" "site/apk/$PKG-$VERSION.apk" site/apk/packages.adb
          (cd site/apk && sha256sum --check SHA256SUMS)
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: site/apk/${{ env.PKG }}-${{ env.VERSION }}.apk
      - name: GitHub release with the signed package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          Signed package for OpenWrt 25.12 (apk). Install and update through LuCI from the feed:
          $PAGES_URL/

          Or add the key (System → Administration → Repository Public Keys) and install
          \`$PKG-$VERSION.apk\` with System → Software → Upload Package….
          Key fingerprint and SHA-256 sums: see the page above and SHA256SUMS.
          EOF
          grep "  $PKG-$VERSION.apk\$" site/apk/SHA256SUMS >"$RUNNER_TEMP/SHA256SUMS"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$PKG $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "site/apk/$PKG-$VERSION.apk" "$RUNNER_TEMP/SHA256SUMS" keys/adblock-fast-monitor.pem
      - name: Upload the Pages site (signed feed)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy the feed to GitHub Pages
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Router smoke test against the published feed
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/release
      - name: Stock OpenWrt 25.12.6 rootfs trusts the feed and resolves the package
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          docker run --rm -v "$PWD/scripts/release:/r:ro" \
            openwrt/rootfs@sha256:14401c04218c2e0da0448f099710ada2460636a92395f353351cc616cf3f67af \
            sh /r/smoke-feed.sh "${PAGE_URL:-$PAGES_URL}"
